# Teste das regras com o promtool, sem precisar da VM:
#   docker run --rm --entrypoint promtool -v "$PWD":/w -w /w prom/prometheus:latest \
#     test rules datane-alerts.test.yml
rule_files:
  - datane-alerts.yml
evaluation_interval: 1m

tests:
  # Um boletim quebrado de vez: só vira alerta depois de 30 min com 0.
  - interval: 1m
    input_series:
      - series: 'datane_boletim_up{job="datane-site",ambiente="produção",id="2v9F6",titulo="Mulheres do Nordeste"}'
        values: "0x45"
      - series: 'datane_boletim_error{job="datane-site",ambiente="produção",id="2v9F6",error="host_not_allowed"}'
        values: "1x45"
    alert_rule_test:
      - eval_time: 29m
        alertname: DataneBoletimFora
        exp_alerts: []
      - eval_time: 31m
        alertname: DataneBoletimFora
        exp_alerts:
          - exp_labels:
              severity: critical
              job: datane-site
              ambiente: produção
              id: 2v9F6
              titulo: Mulheres do Nordeste
            exp_annotations:
              titulo: boletim não abre
              resolvido: boletim voltou a abrir
              descricao: >-
                O boletim "Mulheres do Nordeste" não abre no leitor de PDF
                (produção), motivo host_not_allowed:
                https://datanordeste.sudene.gov.br/boletim/2v9F6.
                host_not_allowed: o link no Contentful não é do gov.br nem do
                Drive. not_a_pdf: o link do gov.br precisa terminar em
                /@@display-file/file, ou o arquivo foi trocado por uma página.
                HTTP 404: o arquivo saiu do gov.br. O link fica no campo "link"
                do post no Contentful.

  # Uma lentidão do gov.br que dura uma verificação (15 min) e passa sozinha:
  # nenhum e-mail.
  - interval: 1m
    input_series:
      - series: 'datane_boletim_up{job="datane-site",ambiente="produção",id="7tbx",titulo="Desertificação"}'
        values: "0x15 1x30"
    alert_rule_test:
      - eval_time: 40m
        alertname: DataneBoletimFora
        exp_alerts: []

  # O gov.br alterna o motivo da falha a cada verificação de 15 min. O motivo
  # fica em datane_boletim_error, e a série datane_boletim_up é uma só: o `for`
  # não recomeça a cada troca, e a descrição traz o motivo do momento.
  - interval: 1m
    input_series:
      - series: 'datane_boletim_up{job="datane-site",ambiente="produção",id="7tbx",titulo="Desertificação"}'
        values: "0x45"
      - series: 'datane_boletim_error{job="datane-site",ambiente="produção",id="7tbx",error="timeout"}'
        values: "1x14 stale _x13 1x14 stale _x13 1x14"
      - series: 'datane_boletim_error{job="datane-site",ambiente="produção",id="7tbx",error="HTTP 503"}'
        values: "_x14 1x14 stale _x13 1x14 stale"
    alert_rule_test:
      - eval_time: 40m
        alertname: DataneBoletimFora
        exp_alerts:
          - exp_labels:
              severity: critical
              job: datane-site
              ambiente: produção
              id: 7tbx
              titulo: Desertificação
            exp_annotations:
              titulo: boletim não abre
              resolvido: boletim voltou a abrir
              descricao: >-
                O boletim "Desertificação" não abre no leitor de PDF
                (produção), motivo timeout:
                https://datanordeste.sudene.gov.br/boletim/7tbx.
                host_not_allowed: o link no Contentful não é do gov.br nem do
                Drive. not_a_pdf: o link do gov.br precisa terminar em
                /@@display-file/file, ou o arquivo foi trocado por uma página.
                HTTP 404: o arquivo saiu do gov.br. O link fica no campo "link"
                do post no Contentful.

  # O certificado do failover venceu e o DNS alterna entre os dois servidores: a
  # cada sonda, ora o certificado bom de prod (9000000 s), ora o vencido (60 s,
  # bem antes de qualquer eval_time). Com a métrica presente, o alerta dispara
  # depois dos 10 min e segue disparando.
  - interval: 5m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="datane-certificado",instance="https://datanordeste-portal.com/health"}'
        values: "9000000 60 9000000 60 9000000 60 9000000 60 9000000 60 9000000 60 9000000 60 9000000 60 9000000 60 9000000 60 9000000 60 9000000 60"
    alert_rule_test:
      - eval_time: 3m
        alertname: DataneCertificadoVencendo
        exp_alerts: []
      - eval_time: 12m
        alertname: DataneCertificadoVencendo
        exp_alerts: []
      - eval_time: 20m
        alertname: DataneCertificadoVencendo
        exp_alerts: &certificado_vencido
          - exp_labels:
              job: datane-certificado
              instance: "https://datanordeste-portal.com/health"
            exp_annotations:
              titulo: certificado HTTPS vencido ou perto de vencer
              resolvido: certificado HTTPS renovado
              descricao: >-
                O certificado de datanordeste-portal.com já venceu em um dos
                servidores. Para ver qual: echo | openssl s_client
                -connect <IP>:443 -servername datanordeste-portal.com | openssl
                x509 -noout -enddate, com os IPs 3.219.77.227 (prod) e
                18.205.78.40 (failover).
      - eval_time: 100m
        alertname: DataneCertificadoVencendo
        exp_alerts: *certificado_vencido

  # O certificado do failover é renovado aos 25 min. O alerta só encerra quando a
  # última sonda com o certificado vencido sai da janela de 1 h (aos 85 min),
  # e não antes: aos 60 min ainda dispara, aos 100 min já não.
  - interval: 5m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="datane-certificado",instance="https://datanordeste-portal.com/health"}'
        values: "9000000 60 9000000 60 9000000 60 9000000x20"
    alert_rule_test:
      - eval_time: 60m
        alertname: DataneCertificadoVencendo
        exp_alerts: *certificado_vencido
      - eval_time: 100m
        alertname: DataneCertificadoVencendo
        exp_alerts: []

  # Ainda válido, mas perto: avisa com 14 dias ou menos, e só então. Um
  # certificado com 10 dias para vencer (alerta) e outro com 20 (nada).
  - interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="datane-certificado",instance="perto"}'
        values: "865200x30"
      - series: 'probe_ssl_earliest_cert_expiry{job="datane-certificado",instance="longe"}'
        values: "1729200x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: DataneCertificadoVencendo
        exp_alerts:
          - exp_labels:
              job: datane-certificado
              instance: perto
            exp_annotations:
              titulo: certificado HTTPS vencido ou perto de vencer
              resolvido: certificado HTTPS renovado
              descricao: >-
                O certificado de datanordeste-portal.com vence em 10d 0h 0m 0s
                em um dos servidores. Para ver qual: echo | openssl s_client
                -connect <IP>:443 -servername datanordeste-portal.com | openssl
                x509 -noout -enddate, com os IPs 3.219.77.227 (prod) e
                18.205.78.40 (failover).

  # O servidor de prod responde (up = 1), mas não traz nenhuma série de serviço:
  # os testes externos estão desligados. Avisa depois dos 10 min.
  - interval: 1m
    input_series:
      - series: 'up{job="datane-site",ambiente="produção",instance="3.219.77.227"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: DataneSemMetricasDeProd
        exp_alerts: []
      - eval_time: 15m
        alertname: DataneSemMetricasDeProd
        exp_alerts:
          - exp_labels:
              severity: critical
              project: datane
              job: datane-site
              ambiente: produção
            exp_annotations:
              titulo: sem dados dos serviços de produção
              resolvido: dados dos serviços de produção voltaram
              descricao: >-
                O site de produção responde, mas /api/metrics não traz o estado
                do Contentful, do Zenodo nem dos boletins, e os alertas de
                serviço e de boletim ficam cegos. Confira se o container de
                prod tem EXTERNAL_CHECKS=1 (deploy-prod.yml).

  # Com as séries presentes, nada a avisar.
  - interval: 1m
    input_series:
      - series: 'up{job="datane-site",ambiente="produção",instance="3.219.77.227"}'
        values: "1x30"
      - series: 'datane_dependency_up{job="datane-site",ambiente="produção",dependency="contentful"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: DataneSemMetricasDeProd
        exp_alerts: []

  # Servidor fora: não há série, e quem avisa é o DataneForaDoAr, e não este.
  - interval: 1m
    input_series:
      - series: 'up{job="datane-site",ambiente="produção",instance="3.219.77.227"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: DataneSemMetricasDeProd
        exp_alerts: []
